<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
  <title>Mobile Shooter Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin:0; overflow:hidden; background:black; touch-action:none; }

    #ui {
      position:absolute;
      top:10px;
      left:10px;
      color:white;
      font-family:Arial;
      font-size:20px;
    }

    #joystick {
      position:absolute;
      bottom:80px;
      left:40px;
      width:120px;
      height:120px;
      background:rgba(255,255,255,0.1);
      border-radius:50%;
    }

    #stick {
      position:absolute;
      width:60px;
      height:60px;
      background:rgba(255,255,255,0.5);
      border-radius:50%;
      top:30px;
      left:30px;
    }

    #shootBtn {
      position:absolute;
      bottom:100px;
      right:50px;
      width:80px;
      height:80px;
      background:red;
      border-radius:50%;
      opacity:0.7;
    }

    #gameOver {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:white;
      font-size:40px;
      display:none;
    }
  </style>
</head>
<body>

<div id="ui">
  Score: <span id="score">0</span><br>
  Health: <span id="health">100</span>
</div>

<div id="gameOver">GAME OVER</div>

<div id="joystick"><div id="stick"></div></div>
<div id="shootBtn"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7);
scene.add(light);

// Ground
let ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x444444})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Player
let player = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,1),
  new THREE.MeshStandardMaterial({color:0x00ff00})
);
player.position.y = 1;
scene.add(player);

// Variables
let score = 0;
let health = 100;
let bullets = [];
let enemies = [];
let currentAngle = 0;
let cameraDistance = 8;

// Spawn Enemy
function spawnEnemy(){
  let enemy = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({color:0xff0000})
  );
  enemy.position.set((Math.random()-0.5)*50,1,(Math.random()-0.5)*50);
  scene.add(enemy);
  enemies.push(enemy);
}
for(let i=0;i<6;i++) spawnEnemy();

// Joystick
let joystick = document.getElementById("joystick");
let stick = document.getElementById("stick");
let moveX=0, moveY=0;

joystick.addEventListener("touchmove", e=>{
  let rect = joystick.getBoundingClientRect();
  let touch = e.touches[0];
  let x = touch.clientX - rect.left - 60;
  let y = touch.clientY - rect.top - 60;
  let dist = Math.sqrt(x*x+y*y);
  if(dist>50){ x*=50/dist; y*=50/dist; }
  stick.style.left=(x+60-30)+"px";
  stick.style.top=(y+60-30)+"px";
  moveX=x/50; moveY=y/50;
});

joystick.addEventListener("touchend", ()=>{
  stick.style.left="30px";
  stick.style.top="30px";
  moveX=0; moveY=0;
});

// Shoot
document.getElementById("shootBtn").addEventListener("touchstart", ()=>{
  let bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.2,8,8),
    new THREE.MeshBasicMaterial({color:0xffff00})
  );
  bullet.position.copy(player.position);
  bullet.direction = new THREE.Vector3(
    Math.sin(currentAngle),0,Math.cos(currentAngle)
  );
  scene.add(bullet);
  bullets.push(bullet);
});

// Game Loop
function animate(){
  requestAnimationFrame(animate);

  if(health<=0){
    document.getElementById("gameOver").style.display="block";
    return;
  }

  let speed = 0.15;

  // Move Player
  if(moveX||moveY){
    currentAngle = Math.atan2(moveX,moveY);
    player.rotation.y=currentAngle;
    player.position.x+=Math.sin(currentAngle)*speed;
    player.position.z+=Math.cos(currentAngle)*speed;
  }

  // Move Bullets
  bullets.forEach((b,i)=>{
    b.position.addScaledVector(b.direction,0.5);

    enemies.forEach((e,ei)=>{
      if(b.position.distanceTo(e.position)<1){
        scene.remove(e);
        enemies.splice(ei,1);
        scene.remove(b);
        bullets.splice(i,1);
        spawnEnemy();
        score+=10;
        document.getElementById("score").innerText=score;
      }
    });
  });

  // Enemy AI
  enemies.forEach(e=>{
    let dir = new THREE.Vector3().subVectors(player.position,e.position).normalize();
    e.position.addScaledVector(dir,0.05);

    if(e.position.distanceTo(player.position)<1.5){
      health-=0.3;
      document.getElementById("health").innerText=Math.floor(health);
    }
  });

  // Camera Follow
  camera.position.x=player.position.x-Math.sin(currentAngle)*cameraDistance;
  camera.position.z=player.position.z-Math.cos(currentAngle)*cameraDistance;
  camera.position.y=player.position.y+5;
  camera.lookAt(player.position);

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
